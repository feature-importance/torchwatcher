[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "torchwatcher"
dynamic = ["version"]
dependencies = [
    "torch>=2.2.0",
    "torchbearer~=0.5.5",
    "numpy>=1.26.0",
    'model-utilities @ git+https://github.com/feature-importance/model-utilities.git@main',
    'pydot>=4.0.0'
]
requires-python = ">=3.11"
authors = [
  {name = "Jonathon Hare", email = "jsh2@soton.ac.uk"},
  {name = "Antonia Marcu", email = "a.marcu@soton.ac.uk"},
  {name = "Jay Bear", email = "jdh1g19@soton.ac.uk"}
]
description = "Utility functions for model training, etc"
readme = "README.md"
license = { file = "LICENSE" }
keywords = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = [
    "src",
]
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
]

[project.urls]
Homepage = "https://github.com/feature-importance/torchwatcher"
Documentation = "https://github.com/feature-importance/torchwatcher"
Repository = "https://github.com/feature-importance/torchwatcher.git"
"Bug Tracker" = "https://github.com/feature-importance/torchwatcher/issues"

[tool.setuptools.dynamic]
version = {attr = "torchwatcher.__version__"}
